# ========================================
# RÈGLES DE VALIDATION DES COMPTES
# ========================================
user_validation_rules:
  # Champs requis pour tous les utilisateurs
  required_fields:
    - "username"
    - "email"
    - "password_hash"
    - "provider"
    - "status"
    - "is_active"
    - "is_verified"
    - "roles"
    
  # Valeurs par défaut pour les champs manquants
  default_values:
    provider: "local"
    status: "pending"
    is_active: false
    is_verified: false
    email_verified: false
    roles: []
    
  # Valeurs requises pour les comptes actifs
  active_user_requirements:
    status: "active"
    is_active: true
    is_verified: true
    
  # Champs legacy à renommer
  field_migrations:
    password: "password_hash"
    
  # Champs à supprimer (obsolètes)
  deprecated_fields:
    - "old_password"
    - "legacy_id"
