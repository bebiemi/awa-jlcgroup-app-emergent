# ========================================
# BUNDLES DE PERMISSIONS
# ========================================
bundles:
  - code: "users.manage"
    name: "Gérer les utilisateurs"
    description: "Accès complet à la gestion des utilisateurs"
    category: "users"
    permissions:
      - "users.view.all"
      - "users.create"
      - "users.edit.all"
      - "users.block"
      - "users.unblock"
      - "users.archive"
      - "users.restore"
      - "users.delete"
      
  - code: "missions.full_access"
    name: "Accès complet aux missions"
    description: "Tous les droits sur les missions"
    category: "missions"
    permissions:
      - "missions.read.all"
      - "missions.create"
      - "missions.update"
      - "missions.assign"
      - "missions.validate"
      - "missions.reject"
      - "missions.archive"
      - "missions.publish"
      - "missions.cancel"
      
  - code: "config.manage"
    name: "Gérer la configuration"
    description: "Gestion complète de la configuration système"
    category: "config"
    permissions:
      - "config.read"
      - "config.update"
      - "config.feature_flags"
      - "config.email_templates"
      
  - code: "admin.access"
    name: "Accès administration"
    description: "Accès complet aux fonctionnalités d'administration"
    category: "admin"
    permissions:
      - "admin.dashboard"
      - "admin.statistics"
      - "admin.audit_logs"
      - "admin.rbac"
      
  - code: "entreprises.manage"
    name: "Gérer les entreprises"
    description: "Gestion complète des entreprises"
    category: "entreprises"
    permissions:
      - "entreprises.view.all"
      - "entreprises.create"
      - "entreprises.edit.all"
      - "entreprises.delete"
      - "entreprises.validate"
      - "entreprises.approve"
      
  - code: "iam.full_access"
    name: "Accès complet IAM"
    description: "Gestion complète des permissions, profils et groupes"
    category: "iam"
    permissions:
      - "iam.permissions.read"
      - "iam.permissions.create"
      - "iam.permissions.edit"
      - "iam.permissions.delete"
      - "iam.profiles.read"
      - "iam.profiles.create"
      - "iam.profiles.edit"
      - "iam.profiles.delete"
      - "iam.groups.read"
      - "iam.groups.create"
      - "iam.groups.edit"
      - "iam.groups.delete"
      - "iam.assign_permissions"
      - "iam.revoke_permissions"
      - "iam.audit"

