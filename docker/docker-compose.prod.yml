version: '3.8'

services:
  # MongoDB avec authentification
  mongodb:
    image: mongo:7.0
    container_name: jlc-mongodb-prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=jlc_db
    networks:
      - jlc-network
    command: mongod --auth
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u ${MONGO_ROOT_USERNAME} -p ${MONGO_ROOT_PASSWORD} localhost:27017/admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour le cache
  redis:
    image: redis:7-alpine
    container_name: jlc-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - jlc-network
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Auth Microservice
  auth-microservice:
    build:
      context: ../auth-microservice
      dockerfile: Dockerfile.prod
    container_name: jlc-auth-prod
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - auth_uploads:/app/uploads
      - logs:/app/logs
    environment:
      - MONGO_URL=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      - DATABASE_NAME=auth_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - CORS_ORIGINS=${CORS_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jlc-network

  # JLC API (FastAPI)
  jlc-api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.prod
    container_name: jlc-api-prod
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - api_uploads:/app/uploads
      - logs:/app/logs
    environment:
      - MONGO_URL=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      - DATABASE_NAME=jlc_db
      - AUTH_SERVICE_URL=http://auth-microservice:8000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - CORS_ORIGINS=${CORS_ORIGINS}
      - UPLOAD_DIR=/app/uploads
      - BASE_URL=${API_BASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
      auth-microservice:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - jlc-network

  # Frontend (React) - Build de production avec Nginx
  jlc-web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=${API_BASE_URL}
        - VITE_AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
    container_name: jlc-web-prod
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - jlc-api
      - auth-microservice
    networks:
      - jlc-network

  # Nginx Reverse Proxy (optionnel si besoin SSL/load balancing)
  nginx:
    image: nginx:1.25-alpine
    container_name: jlc-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - logs:/var/log/nginx
    depends_on:
      - jlc-web
      - jlc-api
      - auth-microservice
    networks:
      - jlc-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  auth_uploads:
    driver: local
  api_uploads:
    driver: local
  logs:
    driver: local

networks:
  jlc-network:
    driver: bridge
