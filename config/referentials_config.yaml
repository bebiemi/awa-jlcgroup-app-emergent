# ========================================
# TYPES DE DOCUMENTS
# ========================================
document_types:
  collection: "referentials"
  key: "document_types"
  version: "1.0"
  items:
    - code: "cv"
      label:
        fr: "CV"
        en: "Resume"
      category: "candidate"
      max_size_mb: 5
      allowed_extensions: ["pdf", "doc", "docx"]
      order: 1
      
    - code: "cover_letter"
      label:
        fr: "Lettre de motivation"
        en: "Cover Letter"
      category: "candidate"
      max_size_mb: 5
      allowed_extensions: ["pdf", "doc", "docx"]
      order: 2
      
    - code: "id_card"
      label:
        fr: "Pièce d'identité"
        en: "ID Card"
      category: "identity"
      max_size_mb: 5
      allowed_extensions: ["pdf", "jpg", "jpeg", "png"]
      order: 3
      
    - code: "diploma"
      label:
        fr: "Diplôme"
        en: "Diploma"
      category: "education"
      max_size_mb: 5
      allowed_extensions: ["pdf", "jpg", "jpeg", "png"]
      order: 4
      
    - code: "contract"
      label:
        fr: "Contrat"
        en: "Contract"
      category: "legal"
      max_size_mb: 10
      allowed_extensions: ["pdf", "doc", "docx"]
      order: 5
      
    - code: "payslip"
      label:
        fr: "Bulletin de salaire"
        en: "Payslip"
      category: "financial"
      max_size_mb: 5
      allowed_extensions: ["pdf"]
      order: 6

