# ========================================
# STATUTS UTILISATEURS
# ========================================
user_statuses:
  collection: "referentials"
  key: "user_statuses"
  version: "1.0"
  items:
    - code: "active"
      label:
        fr: "Actif"
        en: "Active"
      color: "green"
      description: "Utilisateur actif et fonctionnel"
      order: 1
      
    - code: "inactive"
      label:
        fr: "Inactif"
        en: "Inactive"
      color: "gray"
      description: "Utilisateur désactivé temporairement"
      order: 2
      
    - code: "pending"
      label:
        fr: "En attente"
        en: "Pending"
      color: "yellow"
      description: "En attente de validation"
      order: 3
      
    - code: "suspended"
      label:
        fr: "Suspendu"
        en: "Suspended"
      color: "orange"
      description: "Compte suspendu"
      order: 4
      
    - code: "archived"
      label:
        fr: "Archivé"
        en: "Archived"
      color: "gray"
      description: "Utilisateur archivé"
      order: 5

